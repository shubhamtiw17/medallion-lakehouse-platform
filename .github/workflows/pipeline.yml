name: Medallion Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas duckdb pyarrow fastapi uvicorn streamlit plotly pytest requests minio python-dotenv

      - name: Start MinIO
        run: |
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER=${{ secrets.MINIO_ACCESS_KEY }} \
            -e MINIO_ROOT_PASSWORD=${{ secrets.MINIO_SECRET_KEY }} \
            minio/minio server /data --console-address ":9001"

      - name: Wait for MinIO to be ready
        run: |
          echo "Waiting for MinIO..."
          for i in {1..30}; do
            curl -sf http://localhost:9000/minio/health/live && echo "MinIO is ready" && break
            echo "Attempt $i failed, retrying in 2s..."
            sleep 2
          done

      - name: Run Bronze layer
        run: python layers/bronze/ingest.py

      - name: Run Silver layer
        run: python layers/silver/clean.py

      - name: Run Gold layer
        run: python layers/gold/aggregate.py

      - name: Run validation
        run: python validation/validate.py

      - name: Run tests
        run: pytest tests/ -v