name: Medallion Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    services:
      minio:
        image: minio/minio
        ports:
          - 9000:9000
          - 9001:9001
        env:
          MINIO_ROOT_USER: admin
          MINIO_ROOT_PASSWORD: password123
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas duckdb pyarrow fastapi uvicorn streamlit plotly pytest requests minio python-dotenv

      - name: Wait for MinIO to be ready
        run: |
          sleep 10
          curl -f http://localhost:9000/minio/health/live

      - name: Run Bronze layer
        run: python layers/bronze/ingest.py

      - name: Run Silver layer
        run: python layers/silver/clean.py

      - name: Run Gold layer
        run: python layers/gold/aggregate.py

      - name: Run validation
        run: python validation/validate.py

      - name: Run tests
        run: pytest tests/ -v